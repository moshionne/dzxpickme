<!DOCTYPE html>
<html>
<head>
    <title>Викторины</title>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Inter', sans-serif;
            background: linear-gradient(135deg, #ffe6f0 0%, #fff0f5 100%);
            color: #2d2d2d;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 25px 45px -12px rgba(255, 105, 180, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6d9e, #ffb6c1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid #ffb6c1;
            display: inline-block;
            padding-bottom: 0.3rem;
        }

        h2 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #ff6d9e;
            margin: 2rem 0 1rem 0;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(255, 109, 158, 0.3);
        }

        .nav-buttons {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 109, 158, 0.2);
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: white;
            color: #ff6d9e;
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid #ffb6c1;
        }

            .nav-btn:hover {
                background: linear-gradient(135deg, #ff6d9e, #ff8eb5);
                color: white;
                transform: translateY(-2px);
            }

        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            margin: 1.5rem 0;
        }

        .quiz-card-wrapper {
            height: 100%;
        }

        .quiz-card {
            background: white;
            border-radius: 1.5rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 109, 158, 0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

            .quiz-card:hover {
                transform: translateY(-5px);
                border-color: #ff6d9e;
                box-shadow: 0 20px 30px -12px rgba(255, 109, 158, 0.25);
            }

            .quiz-card h3 {
                font-size: 1.3rem;
                color: #ff6d9e;
                margin-bottom: 0.5rem;
                font-weight: 600;
            }

            .quiz-card p {
                color: #666;
                font-size: 0.9rem;
                margin-bottom: 1rem;
                line-height: 1.4;
                flex-grow: 1;
            }

        .quiz-badge {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
            width: fit-content;
        }

            .quiz-badge.official {
                background: linear-gradient(135deg, #ff6d9e, #ffb6c1);
                color: white;
            }

            .quiz-badge.user {
                background: #f0f0f0;
                color: #ff6d9e;
                border: 1px solid #ffb6c1;
            }

            .quiz-badge.create {
                background: linear-gradient(135deg, #a8edea, #fed6e3);
                color: #ff6d9e;
            }

        .quiz-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin: 0.8rem 0;
            font-size: 0.75rem;
            color: #888;
        }

            .quiz-stats span {
                background: rgba(255, 109, 158, 0.05);
                padding: 0.2rem 0.6rem;
                border-radius: 60px;
            }

        .quiz-creator {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid #ffe0e8;
            font-size: 0.75rem;
            color: #ff9eb5;
            font-weight: 500;
        }

        .card-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .btn-play {
            flex: 1;
            text-align: center;
            background: linear-gradient(135deg, #FF6E9F, #FF93B7);
            color: white;
            text-decoration: none;
            padding: 0.6rem;
            border-radius: 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

            .btn-play:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
            }

        .btn-delete {
            flex: 1;
            background: #D81152;
            color: white;
            border: none;
            padding: 0.6rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

            .btn-delete:hover {
                background: #cc0000;
                transform: translateY(-2px);
            }

        .create-card {
            background: linear-gradient(135deg, rgba(255, 109, 158, 0.05), rgba(255, 182, 193, 0.08));
            text-align: center;
            cursor: pointer;
        }

        .create-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
        }

        .empty-state {
            background: rgba(255, 109, 158, 0.05);
            border-radius: 1.5rem;
            padding: 3rem;
            text-align: center;
            color: #ff9eb5;
            border: 1px dashed #ffb6c1;
            grid-column: 1 / -1;
        }

        .create-first-btn {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(135deg, #ff6d9e, #ff8eb5);
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .container {
                padding: 1rem;
            }

            h1 {
                font-size: 1.6rem;
            }

            .quiz-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class='container'>
        <div class='nav-buttons'>
            <a href='/' class='nav-btn'>Главная</a>
            <a href='/leaderboard' class='nav-btn'>Рейтинг</a>
            <a href='/profile' class='nav-btn'>Профиль</a>
        </div>

        <h1>Официальные викторины</h1>
        <div class='quiz-grid'>
            {{defquizzesHtml}}
        </div>

        <h2>Пользовательские викторины</h2>
        <div class='quiz-grid'>
            {{customquizzesHtml}}
        </div>
    </div>
</body>
</html>
