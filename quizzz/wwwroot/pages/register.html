<!DOCTYPE html>
<html>
<head>
    <title>Регистрация</title>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <link rel='stylesheet' href='/css/style.css'>
    <style>
        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #fff0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', sans-serif;
            padding: 20px;
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 45px -12px rgba(255, 105, 180, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6d9e, #ffb6c1);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
        }

        .flower {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

            .form-group input {
                width: 100%;
                padding: 1rem 1rem 1rem 3rem;
                border: 2px solid #ffe0e8;
                border-radius: 1rem;
                font-size: 1rem;
                background: white;
            }

                .form-group input:focus {
                    outline: none;
                    border-color: #ff6d9e;
                    box-shadow: 0 0 0 3px rgba(255, 109, 158, 0.1);
                }

            .form-group .icon {
                position: absolute;
                left: 1rem;
                top: 50%;
                transform: translateY(-50%);
                font-size: 1.2rem;
            }

        button {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #ff6d9e, #ff8eb5);
            color: white;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px -8px #ff6d9e;
            }

        .links {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #ffe0e8;
        }

            .links a {
                color: #ff6d9e;
                text-decoration: none;
                margin: 0 0.5rem;
            }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            padding: 0.75rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class='register-container'>
        <div class='flower'>🌸</div>
        <h1>Создать аккаунт</h1>
        <div id='errorMsg' class='error-message'></div>
        <form id='registerForm'>
            <div class='form-group'>
                <input type='text' id='login' placeholder='Логин' required>
            </div>
            <div class='form-group'>
                <input type='password' id='password' placeholder='Пароль' required>
            </div>
            <div class='form-group'>
                <span class='icon'>✓</span>
                <input type='password' id='confirm' placeholder='Подтвердите пароль' required>
            </div>
            <button type='submit'>Зарегистрироваться</button>
        </form>
        <div class='links'>
            <a href='/login'>Уже есть аккаунт?</a>
            <a href='/'>На главную</a>
        </div>
    </div>
    <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const login = document.getElementById('login').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        const errorDiv = document.getElementById('errorMsg');
        errorDiv.style.display = 'none';
        if (password !== confirm) {
            errorDiv.textContent = 'Пароли не совпадают';
            errorDiv.style.display = 'block';
            return;
        }
        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password, confirmPassword: confirm })
            });
            const result = await response.json();
            if (result.success) {
                alert('Регистрация успешна!');
                window.location.href = '/login';
            } else {
                errorDiv.textContent = result.message || 'Ошибка регистрации';
                errorDiv.style.display = 'block';
            }
        } catch (error) {
            errorDiv.textContent = 'Ошибка подключения';
            errorDiv.style.display = 'block';
        }
    });
    </script>
</body>
</html>
